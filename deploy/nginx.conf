# Rate limits. The site is public and every /api/recommend call spends tokens
# on the team's shared LLM gateway (which itself answers bursts with 403), so
# it gets a tight per-IP limit plus a site-wide cap. Other endpoints are cheap
# and only get a loose per-IP limit against scripted abuse.
# The legacy HTML form (POST /) also runs the agent; GET / must stay unlimited.
# An empty key is not counted, so only POSTs to / share the LLM limits.
map $request_method $llm_ip {
    POST    $binary_remote_addr;
    default "";
}
map $request_method $llm_site {
    POST    $server_name;
    default "";
}
limit_req_zone $llm_ip   zone=recommend_ip:10m  rate=6r/m;
limit_req_zone $llm_site zone=recommend_all:1m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_ip:10m       rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64k;

    # 429s come back as the app's usual JSON error shape.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error": "Too many requests from this address. Please wait a minute and try again."}';
    }

    # LLM paths: 6 per minute per IP (bursts of 4 served at once), 30 per
    # minute for the whole site. /api/recommend is always a POST.
    location = /api/recommend {
        limit_req zone=recommend_ip burst=4 nodelay;
        limit_req zone=recommend_all burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/recommend waits for the LLM.
        proxy_read_timeout 180s;
    }

    location /api/ {
        limit_req zone=api_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        limit_req zone=recommend_ip burst=4 nodelay;
        limit_req zone=recommend_all burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
